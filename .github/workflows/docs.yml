name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'rspress.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/docs.yml'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'rspress.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/docs.yml'
      - 'Makefile'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: make docs-check docs-build
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: doc_build
          if-no-files-found: error
