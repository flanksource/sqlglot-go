name: Create Release
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  create-release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: flanksource/action-workflows/.github/workflows/create-release.yml@807c141342c97374e637b4375e3a54e62cd8736e # v1.3.0

  binaries:
    name: Publish binaries and container images
    needs: create-release
    if: needs.create-release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.12.7
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test the published image
        env:
          IMAGE: ghcr.io/flanksource/sqlglot-go:${{ needs.create-release.outputs.tag }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          test "$(docker run --rm "$IMAGE" version)" = "${RELEASE_TAG#v}"
          docker run --rm "$IMAGE" validate 'SELECT 1' --json
