# The differential suite uses committed expectations from the Python reference.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database-integration:
    name: Database integration (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            args: --extra-args=-count=1,-ginkgo.focus=PostgreSQL ./database/migrate/review
          - database: sqlserver
            args: --extra-args=-count=1 ./database/migrate/scripts/sqlserver/integration ./database/migrate/csvdata/integration
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'mirror.gcr.io/library/postgres:latest' || '' }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run database integration tests
        uses: flanksource/gavel@4ec24346ade41681a5f1db1de47acd32c32e0879 # v0.0.83
        env:
          SQLGLOT_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
        with:
          version: v0.0.83
          args: test --framework ginkgo --tags integration --timeout 12m ${{ matrix.args }}
          artifact-name: gavel-integration-${{ matrix.database }}
          comment-header: gavel-integration-${{ matrix.database }}
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}

  coverage:
    name: Coverage and differential tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run the Go and differential suites
        uses: flanksource/gavel@4ec24346ade41681a5f1db1de47acd32c32e0879 # v0.0.83
        with:
          version: v0.0.83
          args: test --framework go,ginkgo --timeout 15m --extra-args=-coverpkg=./sqlglot/,-coverprofile=cover.out
          artifact-name: gavel-coverage
          comment-header: gavel-coverage
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
      - name: test coverage floor
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "coverage: $pct%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 95) { print "below the 95% floor"; exit 1 } }'
      # The README's tables are the coverage files, or they are a second copy
      # that drifts. The differential suite rewrites testdata/**/coverage.json from
      # the run it just did, so this compares the README against measurements
      # taken seconds ago rather than against whatever was committed.
      - name: the README's numbers are what was measured
        run: python3 harness/gen_readme.py --check
      # A crash in a parser that sits under a security guard is a denial of
      # service in front of a database, so this one runs on every build. Its
      # sibling, FuzzGeneratedSQLCanBeReadBack, is deliberately NOT here yet:
      # it has an open finding recorded on the target itself.
      # -fuzztime bounds the SEARCH; -timeout bounds the whole test binary. On
      # a loaded runner the two collided: the search hit its deadline while a
      # worker was mid-execution, and the step failed with "context deadline
      # exceeded" and NO failing input written -- a shutdown race, not a hang.
      # Confirmed by 37.8M local executions with no finding. A generous
      # -timeout leaves room for the last execution to finish and report.
      - name: a short fuzz for parser panics
        run: go test ./sqlglot/ -run=XXX -fuzz=FuzzParseOneNeverPanics -fuzztime=45s -timeout=10m

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Install golangci-lint
        uses: flanksource/deps@f04324f706a671af0fd0b1d7f9a708c9ec1643f4 # v1.0.28
        with:
          version: v1.0.28
          tools: golangci-lint@v2.13.1
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run Go lint
        uses: flanksource/gavel@4ec24346ade41681a5f1db1de47acd32c32e0879 # v0.0.83
        with:
          version: v0.0.83
          args: lint golangci-lint --timeout 10m
          artifact-name: gavel-lint
          comment-header: gavel-lint
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}

  # The committed expectations must be exactly what the pinned reference
  # produces. Regenerate and diff; a difference means someone edited an
  # expectation by hand, or regenerated against a commit NOTICE does not name.
  oracle-is-pinned:
    name: Expectations match the pinned reference
    runs-on: ubuntu-latest
    # Parser regeneration adds about 30–50s of probing per dialect. The
    # combined reference checks reached 20 minutes during regeneration.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The reference's own optional dependency. Its optimizer folds dates
      # through dateutil, imported lazily and behind a decorator that catches
      # the ImportError -- so without this the reference is not the reference,
      # it is a quieter version of it, and the generated contract silently
      # loses every date fold.
      - run: pip install python-dateutil
      - name: the commit NOTICE pins
        id: pin
        run: echo "ref=$(grep -oE 'commit [0-9a-f]{40}' NOTICE | head -1 | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # actions/checkout rather than `git clone`, which is not a style
      # preference: an ANONYMOUS clone from a runner is rate limited and
      # started returning 403 while the repository itself was public and
      # reachable. This step authenticates with the workflow's own token.
      - name: check out the pinned reference
        uses: actions/checkout@v4
        with:
          repository: tobymao/sqlglot
          ref: ${{ steps.pin.outputs.ref }}
          path: reference
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: regenerate and diff
        run: |
          python3 harness/oracle.py --sqlglot reference --out /tmp/expected
          diff -rq testdata/expected /tmp/expected && echo "expectations are exactly the pinned reference's"
      # The tokenizer's keyword and dialect tables are generated from the same
      # pin. A hand-edited table would be a silent divergence from the
      # reference in the one place the port has no logic to catch it.
      # The batched differential, which is the only place the read-back
      # property can be a GATE rather than a discovery run.
      #
      # `FuzzGeneratedSQLCanBeReadBack` on its own cannot be one: three of its
      # findings turned out to be sqlglot doing the same thing, and a property
      # stronger than the oracle's reports the reference's behaviour as ours.
      # So the fuzzer collects, the adjudicator asks the reference about each
      # finding, and only a YOURS verdict -- the reference handles it, the port
      # does not -- fails the build. It exits non-zero on exactly that.
      #
      # 45 seconds found 96,096 findings collapsing to one real cause the first
      # time it ran. It now finds none.
      - name: fuzz the generator, and let the reference judge what it finds
        run: |
          DAS_FUZZ_COLLECT=/tmp/candidates.txt \
            go test ./sqlglot/ -run=XXX -fuzz=FuzzGeneratedSQLCanBeReadBack -fuzztime=45s
          if [ -s /tmp/candidates.txt ]; then
            sort -u /tmp/candidates.txt -o /tmp/candidates.txt
            python3 harness/adjudicate.py --sqlglot reference --candidates /tmp/candidates.txt
          else
            echo "the generator wrote nothing the parser could not read back"
          fi
      - name: the generated tables are the reference's
        run: |
          cp sqlglot/tokentype_gen.go sqlglot/dialects_gen.go sqlglot/parser_gen.go sqlglot/classes_gen.go /tmp/
          python3 harness/gen_tokenizer.py --sqlglot reference --out sqlglot
          python3 harness/gen_parser.py --sqlglot reference
          python3 harness/gen_classes.py --sqlglot reference > sqlglot/classes_gen.go
          cp testdata/simplify.json testdata/annotate.json sqlglot/annotate_gen.go /tmp/
          python3 harness/gen_simplify.py --sqlglot reference
          python3 harness/gen_annotate.py --sqlglot reference
          gofmt -w sqlglot/tokentype_gen.go sqlglot/dialects_gen.go sqlglot/parser_gen.go sqlglot/classes_gen.go
          diff /tmp/tokentype_gen.go sqlglot/tokentype_gen.go
          diff /tmp/dialects_gen.go sqlglot/dialects_gen.go
          diff /tmp/parser_gen.go sqlglot/parser_gen.go
          diff /tmp/classes_gen.go sqlglot/classes_gen.go
          diff /tmp/simplify.json testdata/simplify.json
          diff /tmp/annotate.json testdata/annotate.json
          diff /tmp/annotate_gen.go sqlglot/annotate_gen.go
          echo "generated tables are exactly the pinned reference's"

  # The one check here that can fail because two queries MEAN different
  # things rather than because two strings differ. Every other harness
  # compares trees or text against sqlglot, which proves the port agrees with
  # the reference and never that either is right.
  #
  # The Go suite emits the pairs and Python runs them against DuckDB and PostgreSQL.
  execution-oracle:
    name: The port's SQL means what it was given
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DuckDB embeds; PostgreSQL needs a server, and a service container is
    # the cheapest one there is. Databricks has no local engine at all, and
    # the neutral dialect rewrites 8 statements out of 991 -- neither would
    # earn the infrastructure.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:latest
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGDSN: host=127.0.0.1 port=5432 user=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r harness/requirements-execute.txt
      - name: verify execution comparisons and isolation
        run: python -m pytest harness -q
      - name: run it through both engines and compare the rows
        run: make oracle-exec
